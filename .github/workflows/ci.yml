name: ci
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aaf, POSTGRES_PASSWORD: change-me, POSTGRES_DB: postgres }
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U aaf" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/requirements.txt }
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest
        working-directory: apps/api

  rover-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: edge/rover-agent/requirements.txt }
      - run: pip install -r edge/rover-agent/requirements.txt
      - run: python -m pytest
        working-directory: edge/rover-agent

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++11 -I.. test_drive_protocol.cpp -o t && ./t
        working-directory: edge/rover-motor-controller/test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
