# AgriRover — full Docker stack with MongoDB (NoSQL) + FastAPI + Mosquitto + React.
#   docker compose up -d                 MongoDB (NoSQL) + FastAPI backend + React dashboard
#   docker compose --profile sim up -d   ... plus simulated rover & field node telemetry
services:
  mongo:
    image: mongo:7
    ports: [ "27017:27017" ]
    volumes: [ "./mongodata:/data/db" ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports: [ "1883:1883" ]

  api:
    build: ./apps/api
    env_file: [ .env ]
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-agrirover}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL-gemma4}
      PHOTO_DIR: /farm-photos
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    depends_on:
      mongo: { condition: service_healthy }
      broker: { condition: service_started }
    ports: [ "8000:8000" ]
    volumes: [ "./apps/api:/srv", "./farm-photos:/farm-photos" ]
    command: >
      sh -c "python -m app.services.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./apps/web
    env_file: [ .env ]
    depends_on: [ api ]
    ports: [ "5173:5173" ]
    volumes:
      - ./apps/web:/srv
      - /srv/node_modules
    command: npm run dev -- --host 0.0.0.0

  rover-sim:
    build: ./edge/rover-agent
    profiles: [ "sim" ]
    environment:
      MQTT_HOST: broker
      ROVER_REPORT_DIR: /srv/reports
    depends_on: [ broker ]
    volumes: [ "./edge/rover-agent/reports:/srv/reports" ]

  field-sim:
    build: ./edge/field-node-sim
    profiles: [ "sim" ]
    environment:
      MQTT_HOST: broker
      SIM_SCENARIO: ${SIM_SCENARIO:-dry}
      SIM_PROBE: rain
      SIM_ZONE: g1
      SIM_INTERVAL: "10"
    depends_on: [ broker ]
